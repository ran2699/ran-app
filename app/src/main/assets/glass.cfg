# RAN Glass · LiquidGlassView 参数
# 任意 key 会按 PROP 映射写成库属性（反射），所以调参不用重新出包：
#   adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#   adb shell am broadcast -a com.ran.agent.RELOAD
# 单位：bevel/refr/corner/islandCorner = dp；其余无量纲；0x 开头 = ARGB 整数

bevel=16          # 边缘斜面带宽度（玻璃厚度）
refr=22           # 贴边折射位移
falloff=2.2       # 折射衰减指数：越大弯折越贴边、越细密
disp=0.06         # 色散强度 0-1，>0.25 像彩虹玻璃
corner=22         # 顶栏玻璃圆角
islandCorner=28   # 输入岛圆角

blur=0.35         # 背景模糊量（默认 0.0625，越大越雾）
sat=110           # 背景饱和度百分比（默认 140，调低更接近 iOS）
dispScale=70      # 经典管线位移量
aberration=2      # 色差强度
tint=0x59FFFFFF   # 玻璃白色着色 ARGB（0x59 ≈ 35% 不透明度）

sensor=1          # 1=高光跟随重力感应
adaptive=1        # 1=按背景亮度自适应染色
probe=1           # 1=显示参数探针
