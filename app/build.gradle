plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ran.elder'
    compileSdk 34

    defaultConfig {
        applicationId "com.ran.elder"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-test"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
