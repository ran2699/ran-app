# RAN Glass · LiquidGlassView 参数（长度单位 dp，库内部需要 px 由代码换算）
# 推送后广播重载，无需重新出包：
#   adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#   adb shell am broadcast -a com.ran.agent.RELOAD

bevel=16        # 边缘斜面带宽度（玻璃厚度）
refr=22         # 贴边折射位移
falloff=2.2     # 折射衰减指数：越大弯折越贴边越细密
disp=0.07       # 色散强度 0-1，>0.25 像彩虹玻璃
corner=22       # 顶栏玻璃圆角
islandCorner=28 # 输入岛圆角
sensor=1        # 1=高光跟随重力感应
adaptive=1      # 1=按背景亮度自适应染色
probe=0         # 1=显示参数探针
