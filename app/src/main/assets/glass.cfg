# RAN Glass 默认参数（key = 库属性真名；dp 键自动换算 px；0x 开头按 ARGB）
# 面板里调完点「保存」会覆盖本文件；也可用 adb 推送 + 广播热调

useShaderPipeline=1
material=1
corner=22
islandCorner=28

bevelWidth=20
refractionHeight=34
refractionFalloff=2.2
dispersionStrength=0.08

blurAmount=0.30
saturation=105
glassTint=0x8CFFFFFF

milk=0.93

enableEdgeHighlight=1
edgeHighlightBorderWidth=3
edgeHighlightOpacity=100
enableShadow=1
enableAdaptiveTint=1
enableSensorHighlight=1
probe=0
