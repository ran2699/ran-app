# RAN Glass 参数 · 长度一律 dp（着色器内乘 dens 换算设备像素），角度用弧度
# 改完推送后广播重载，不必重新出包：
#   adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#   adb shell am broadcast -a com.ran.agent.RELOAD

bevel=7          # 边缘折射带宽度
refraction=5     # 边缘最大位移（自动夹到 bevel*0.72 以内，防止采样折返）
disp=0           # 色散位移 px，0=关（模糊后本就不可见）
tintA=0.40       # 白色着色，玻璃的"奶"
rimA=2.0         # 边缘方向光高光
crispA=0.26      # 最外圈细描边（白底上靠它立住轮廓）
shadowA=0.28     # 外部投影强度
shadowY=6        # 投影下移
shadowR=18       # 投影柔和度
lightA=-2.35     # 光源方向（弧度，约左上）
stages=2         # 模糊趟数 1/2/3
probe=0          # 1=显示调试探针
