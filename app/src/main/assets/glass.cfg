# RAN Glass · LiquidGlassView 最终参数
# key = 库属性真名（驼峰），反射写入；dp 键自动换算 px；0x 开头按 ARGB 解析
# 热调：adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#       adb shell am broadcast -a com.ran.agent.RELOAD

# ---- 管线：1=透镜2.0（SDF 折射，背景有内容时边缘会弯折） 0=经典（模糊更强）----
useShaderPipeline=1

# ---- 材质形状 ----
material=1            # 0=CLEAR 更透 1=REGULAR 可读性优先
corner=22             # dp 顶栏圆角
islandCorner=28       # dp 输入岛圆角

# ---- 透镜管线 ----
bevelWidth=18         # dp 边缘斜面宽度
refractionHeight=28   # dp 贴边折射位移
refractionFalloff=2.2
dispersionStrength=0.05

# ---- 经典管线（pipeline=0 时生效）----
blurAmount=1.2
saturation=110
glassTint=0x8CFFFFFF

# ---- 奶白层：子层自绘，任何管线都生效，0=纯玻璃 1=全白 ----
milk=0.62

# ---- 边缘与投影 ----
enableEdgeHighlight=1
edgeHighlightBorderWidth=3
edgeHighlightOpacity=100
enableShadow=1
enableAdaptiveTint=1
enableSensorHighlight=1
probe=0
