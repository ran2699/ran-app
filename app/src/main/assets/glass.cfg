# RAN Glass · 参数（key = 库属性真名；dp 键自动换算 px；0x 开头按 ARGB）
# 热调：adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#       adb shell am broadcast -a com.ran.agent.RELOAD

useShaderPipeline=1   # 1=透镜2.0：SDF 折射 + 弱模糊（与 iOS 顶栏一致的"几乎看不出模糊"）
material=1            # 1=REGULAR 可读性优先
corner=22
islandCorner=28

bevelWidth=20         # dp 边缘斜面
refractionHeight=34   # dp 贴边折射位移（彩色内容经过时会把内容弯折）
refractionFalloff=2.2
dispersionStrength=0.08

blurAmount=0.12       # 仅经典管线用
saturation=105
glassTint=0x8CFFFFFF

# 奶白层：决定"白不白"。实测 0.62 时按钮亮度低于底板（发灰）→ 必须 >0.9
milk=0.93

enableEdgeHighlight=1
edgeHighlightBorderWidth=3
edgeHighlightOpacity=100
enableShadow=1
enableAdaptiveTint=1
enableSensorHighlight=1
probe=0
