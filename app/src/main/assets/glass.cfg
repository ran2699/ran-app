# RAN Glass · LiquidGlassView 参数
# key = 库属性真名（驼峰），反射写入；dp 键自动换算 px；0x 开头按 ARGB 解析
# 调参：adb push glass.cfg /sdcard/Android/data/com.ran.agent/files/glass.cfg
#       adb shell am broadcast -a com.ran.agent.RELOAD

# ---- 管线 ----
useShaderPipeline=1   # 1=透镜2.0(SDF折射) 0=经典管线(blurAmount/tint 生效)

# ---- 材质形状 ----
material=1            # 0=CLEAR 1=REGULAR
corner=22             # dp 顶栏圆角
islandCorner=28       # dp 输入岛圆角

# ---- 透镜管线 ----
bevelWidth=16         # dp
refractionHeight=22   # dp
refractionFalloff=2.2
dispersionStrength=0.06

# ---- 经典管线 ----
blurAmount=0.30
saturation=110
glassTint=0x8CFFFFFF

# ---- 奶白层（自绘子层，任何管线都生效，0=纯玻璃 1=全白）----
milk=0.35

# ---- 其他 ----
enableAdaptiveTint=1
enableSensorHighlight=1
enableEdgeHighlight=1
enableShadow=0
probe=0
